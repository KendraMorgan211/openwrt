<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>语义化注册表单</title>
</head>
<body>
  <h1>注册新账号</h1>

  <form action="/register" method="post">
    <fieldset>
      <legend>账号信息</legend>

      <p>
        <label for="username">用户名</label>
        <input id="username" type="text" required minlength="2" maxlength="20"
               placeholder="2-20 个字符">
      </p>

      <p>
        <label for="email">邮箱</label>
        <input id="email" type="email" required placeholder="name@example.com">
      </p>

      <p>
        <label for="phone">电话</label>
        <input id="phone" type="tel" pattern="1[3-9]\d{9}" placeholder="11 位手机号">
      </p>

      <p>
        <label for="password">密码</label>
        <input id="password" type="password" required minlength="8" placeholder="至少 8 位">
      </p>
    </fieldset>

    <fieldset>
      <legend>个人资料</legend>

      <p>
        <label for="city">城市</label>
        <select id="city">
          <option value="">请选择</option>
          <option value="beijing">北京</option>
          <option value="shanghai">上海</option>
          <option value="shenzhen">深圳</option>
        </select>
      </p>

      <p>
        <label for="bio">简介</label>
        <textarea id="bio" rows="4" placeholder="简单介绍一下自己"></textarea>
      </p>

      <p>
        <input id="subscribe" type="checkbox">
        <label for="subscribe">订阅每周技术周刊</label>
      </p>
    </fieldset>

    <p>
      <button type="submit">提交注册</button>
      <button type="reset">重新填写</button>
    </p>
  </form>
</body>
</html>
